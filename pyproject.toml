[project]
name = "invex"
version = "0.1.0"
description = "Microstructure invariance and zero-shot transfer of learned execution policies in exact L3 replay"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24,<2",
    "numba>=0.59",
    "torch>=2.1",
    "pyarrow>=14",
    "pandas>=2.0",
    "scipy>=1.10",
    "requests>=2.28",
    "orjson>=3.9",
    "matplotlib>=3.7",
    "lightgbm>=4.3",
]

[project.optional-dependencies]
dev = ["pytest", "hypothesis>=6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: needs a real ITCH or Coinbase day on disk (run with -m slow)",
    "network: downloads from the internet",
]
addopts = "-m 'not slow and not network'"
